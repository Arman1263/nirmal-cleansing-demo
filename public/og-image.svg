<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="100%" stop-color="#EBF3ED"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E6F40"/>
      <stop offset="100%" stop-color="#1B4326"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="280" fill="#2E6F40" opacity="0.06"/>
  <circle cx="120" cy="520" r="220" fill="#2E6F40" opacity="0.05"/>
  
  <!-- Badge -->
  <rect x="120" y="140" width="220" height="42" rx="21" fill="#2E6F40" fill-opacity="0.1"/>
  <text x="230" y="167" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#2E6F40" text-anchor="middle" letter-spacing="1.5">PRODUCT SHOWCASE</text>
  
  <!-- Logo / Brand Name -->
  <text x="120" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="800" fill="#1C1917" letter-spacing="-1">NIRMAL</text>
  <circle cx="475" cy="256" r="10" fill="#2E6F40"/>
  
  <!-- Tagline -->
  <text x="120" y="325" font-family="system-ui, sans-serif" font-size="30" font-weight="500" fill="#57534E">Everyday Care. Thoughtfully Made.</text>
  
  <!-- Subtitle -->
  <text x="120" y="380" font-family="system-ui, sans-serif" font-size="22" fill="#78716C">Household Cleaning Liquids &amp; Handcrafted Body Soaps</text>
  
  <!-- Card Mockups Preview -->
  <g transform="translate(740, 160)">
    <rect width="360" height="340" rx="24" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
    <rect x="24" y="24" width="312" height="190" rx="16" fill="#F5F5F0"/>
    <text x="180" y="125" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#2E6F40" text-anchor="middle">Household &amp; Personal Care</text>
    <rect x="24" y="235" width="180" height="20" rx="10" fill="#2E6F40"/>
    <rect x="24" y="265" width="260" height="12" rx="6" fill="#D6D3D1"/>
    <rect x="24" y="285" width="190" height="12" rx="6" fill="#E7E5E4"/>
  </g>
</svg>

